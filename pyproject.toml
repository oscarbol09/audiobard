[build-system]
requires = ["setuptools>=68", "wheel"]
build_backend = "setuptools.build_meta"

[project]
name = "audiobard"
version = "0.1.0"
description = "AI-powered audiobook generator with multi-character voice synthesis. 100% free, FOSS-first, offline-capable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oscar Bol", email = "oscarbol09@users.noreply.github.com" }]
keywords = ["audiobook", "tts", "text-to-speech", "piper-tts", "ollama", "epub"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "pydub>=0.25",
    "typer>=0.12",
    "rich>=13.7",
    "mutagen>=1.47",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
llm-ollama = ["ollama>=0.2"]
llm-gemini = ["google-generativeai>=0.4"]
tts-piper = []
tts-edge = ["edge-tts>=6.1"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "aiofiles>=23.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "respx>=0.21",
]

[project.scripts]
audiobard = "audiobard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiobard = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ebooklib.*", "ollama.*", "edge_tts.*", "mutagen.*", "pydub.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that need real LLM/TTS binaries (deselect with '-m \"not integration\"')",
]