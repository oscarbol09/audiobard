<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="abSpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="40%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="abSpText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>
    <linearGradient id="abPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>
    <filter id="abSpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#abSpBg)" />
  <rect width="1276" height="636" x="2" y="2" fill="none" stroke="#30363d" stroke-width="2" />

  <!-- Grid lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.3">
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Left Card Emblem -->
  <g transform="translate(100, 140)">
    <rect width="360" height="360" rx="48" fill="#161b22" stroke="#30363d" stroke-width="3" filter="url(#abSpGlow)" />
    
    <!-- Open Book & Waveform -->
    <g transform="translate(70, 70)">
      <!-- Open Book -->
      <path d="M15,130 C60,105 105,105 110,135 C115,105 160,105 205,130 L205,190 C160,165 115,165 110,195 C105,165 60,165 15,190 Z" fill="#21262d" stroke="#58a6ff" stroke-width="4" />
      <path d="M110,135 L110,195" stroke="#58a6ff" stroke-width="4" />

      <!-- Glowing Waves -->
      <g stroke-linecap="round" stroke-width="6">
        <line x1="110" y1="80" x2="110" y2="15" stroke="#a371f7" />
        <line x1="85" y1="90" x2="85" y2="35" stroke="#38bdf8" />
        <line x1="135" y1="90" x2="135" y2="35" stroke="#38bdf8" />
        <line x1="60" y1="100" x2="60" y2="55" stroke="#34d399" />
        <line x1="160" y1="100" x2="160" y2="55" stroke="#34d399" />
        <line x1="35" y1="110" x2="35" y2="75" stroke="#fbbf24" />
        <line x1="185" y1="110" x2="185" y2="75" stroke="#fbbf24" />
      </g>
    </g>
  </g>

  <!-- Right Side: Text & Features -->
  <g transform="translate(520, 150)">
    <!-- Pill Badge -->
    <rect width="260" height="34" rx="17" fill="#8957e5" fill-opacity="0.15" stroke="#a371f7" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#38bdf8" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff" letter-spacing="0.5">OPEN-SOURCE AUDIOBOOKS</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#abSpText)" letter-spacing="-1.5">
      AudioBard
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#8b949e">
      Open-source multi-voice audiobook generator.
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#c9d1d9">
      Turns public-domain EPUB/TXT into rich cast-narrated audiobooks.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 240)">
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#7ee787">Desktop (Tauri)</text>
      </g>
      <g transform="translate(195, 0)">
        <rect width="180" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#79c0ff">Offline Mode</text>
      </g>
      <g transform="translate(390, 0)">
        <rect width="170" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#d2a8ff">Piper / Edge TTS</text>
      </g>
      <g transform="translate(575, 0)">
        <rect width="140" height="42" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
        <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#ffa657">Cloud BYOK</text>
      </g>
    </g>
  </g>

  <!-- Bottom URL -->
  <g transform="translate(520, 500)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8b949e">
      github.com/oscarbol09/audiobard
    </text>
  </g>
</svg>
