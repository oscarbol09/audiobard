name: Desktop Release (Tauri v2)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-tauri:
    name: Build & Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'gui/package-lock.json'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Install GUI Dependencies
        run: |
          cd gui
          npm install

      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Build Python Sidecar (PyInstaller)
        shell: bash
        run: |
          uv pip install pyinstaller
          uv run pyinstaller --onefile --name python-sidecar src/audiobard/api.py
          mkdir -p src-tauri/bin
          
          # Detect the Rust target triple
          TARGET=$(rustc -Vv | grep host | cut -d ' ' -f 2)
          if [ "${{ matrix.platform }}" == "macos-latest" ]; then
            TARGET="universal-apple-darwin"
          fi
          
          # Move and rename binary for Tauri
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            mv dist/python-sidecar.exe src-tauri/bin/python-sidecar-$TARGET.exe
          else
            mv dist/python-sidecar src-tauri/bin/python-sidecar-$TARGET
          fi

      - name: Build Tauri Application & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AudioBard v__VERSION__ 🎙️'
          releaseBody: 'See [CHANGELOG.md](https://github.com/oscarbol09/audiobard/blob/main/CHANGELOG.md) for full release notes.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
