# CI for the framework itself: lint, type-check, tests, coverage gate,
# and security guards.
#
# Deliberately NOT here: live LLM/TTS calls. They hit external services and
# need API keys or local model binaries (Ollama, Piper) that CI does not have.
# CI runs the mocked/fixture test suites only; live end-to-end runs stay a
# local, on-demand step (the pipeline smoke test in the dev plan).
#
# Security posture: this package executes LLM provider code and reads user
# books, so the guards job fails PRs that commit API keys, drop the
# personal-data gitignore rules, or track copyrighted books under data/;
# dependency-review flags newly introduced vulnerable/malicious dependencies.
# Honest limit: a PR can edit this workflow itself, so these guards catch
# accidents and casual attempts, not a determined author - branch protection
# with required checks and human review of workflow diffs remain the real
# backstop.
# Actions are pinned to commit SHAs; the token is read-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,api]"
      - run: ruff check src tests tools
      - run: mypy src/audiobard

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install ".[dev,api]"
      - name: Run unit tests with coverage
        run: |
          pytest --cov=audiobard --cov-report=term-missing --cov-fail-under=70 -m "not integration"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392 # v4.0.0
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
        if: always()

  guards:
    name: Security guards (secrets, gitignore, data/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/guards.py

  dependency-review:
    name: Dependency review
    # Requires the repo's Dependency graph, which must be enabled under
    # Settings -> Advanced Security. Probe first, warn-and-pass when
    # unavailable, same graceful-skip pattern the rest of the workflow uses
    # for optional tooling.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Probe Dependency graph availability
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is not enabled on this repository (HTTP $code). Dependency review was skipped - enable Dependency graph under Settings -> Advanced Security to activate this check."
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high