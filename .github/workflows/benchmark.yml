# Attribution benchmark CI workflow.
#
# Runs on three triggers:
#   - pull_request: gates any PR that touches prompts/parsers/attribution
#     logic. Uses Gemini by default (no local model install, fast) so PRs
#     aren't slowed down by pulling an Ollama model. Fails the job (and
#     therefore the PR check) if accuracy drops below the 70% threshold
#     enforced by eval/benchmark.py.
#   - schedule (weekly): full run against the default local model (Ollama)
#     to catch drift with zero API cost.
#   - workflow_dispatch: manual run against any provider/model.
#
# This closes the gap where CONTRIBUTING.md's "benchmark output required"
# rule depended entirely on a human reviewer remembering to ask for it.

name: Benchmark

on:
  pull_request:
    paths:
      - "src/audiobard/llm/**"
      - "src/audiobard/parser/**"
      - "eval/benchmark.py"
      - "eval/gold_standard/**"
      - ".github/workflows/benchmark.yml"
  schedule:
    # Every Monday at 4:00 AM UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      llm:
        description: "LLM provider to benchmark"
        required: true
        default: "ollama"
        type: choice
        options:
          - ollama
          - gemini
          - openrouter
      model:
        description: "Model to benchmark"
        required: true
        default: "qwen2.5:7b"
        type: string

permissions:
  contents: read
  pull-requests: write # only used to post the accuracy comment on PR runs

jobs:
  benchmark:
    name: Dialog Attribution Accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Resolve provider/model for this run
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PRs default to Gemini: no local model pull, keeps PR checks fast.
            # Requires the GEMINI_API_KEY repo secret; forked PRs won't have
            # it and this step will fail loudly rather than silently pass -
            # that's intentional (see note in the "Run benchmark" step below).
            echo "llm=gemini" >> "$GITHUB_OUTPUT"
            echo "model=gemini-2.0-flash" >> "$GITHUB_OUTPUT"
          else
            echo "llm=${{ github.event.inputs.llm || 'ollama' }}" >> "$GITHUB_OUTPUT"
            echo "model=${{ github.event.inputs.model || 'qwen2.5:7b' }}" >> "$GITHUB_OUTPUT"
          fi

      - run: pip install ".[dev,llm-ollama]"

      - name: Install and start Ollama
        if: steps.resolve.outputs.llm == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for Ollama to startup
          for i in {1..30}; do
            curl -s http://localhost:11434 && break
            sleep 1
          done
          ollama pull "${{ steps.resolve.outputs.model }}"

      - name: Check Gemini key is available (PR runs only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::error::GEMINI_API_KEY secret is not set. PRs from forks don't receive repo secrets by default - see .github/workflows/benchmark.yml for options (e.g. require maintainer to re-run from a branch, or switch this job's default to a provider that doesn't need a secret)."
            exit 1
          fi

      - name: Run benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python eval/benchmark.py \
            --llm "${{ steps.resolve.outputs.llm }}" \
            --model "${{ steps.resolve.outputs.model }}" \
            --json | tee benchmark_results.json
        # NOTE: eval/benchmark.py exits 1 when accuracy < 70%. That non-zero
        # exit fails this step, which fails this job, which fails the PR's
        # required check (once branch protection requires it - see
        # CONTRIBUTING.md and the repo's Settings -> Branches). This is the
        # actual regression gate; everything else in this file is plumbing
        # around it.

      - name: Comment PR with benchmark results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const raw = fs.readFileSync('benchmark_results.json', 'utf8');
              // benchmark.py prints a status line before the JSON blob even
              // in --json mode, so find the first '{' rather than parsing
              // the whole file.
              const jsonStart = raw.indexOf('{');
              const parsed = JSON.parse(raw.slice(jsonStart));
              const acc = (parsed.accuracy * 100).toFixed(1);
              const passed = parsed.accuracy >= 0.70;
              const icon = passed ? '✅' : '❌';
              body = [
                `### ${icon} Attribution benchmark`,
                '',
                `**Accuracy:** ${acc}% (${parsed.correct}/${parsed.total} lines) — provider \`${{ steps.resolve.outputs.llm }}\`, model \`${{ steps.resolve.outputs.model }}\``,
                '',
                passed
                  ? 'No regression detected against the 70% gate.'
                  : '**Below the 70% gate — this blocks merge.** See CONTRIBUTING.md § "The benchmark bar".',
              ].join('\n');
            } catch (e) {
              body = '### ⚠️ Attribution benchmark\n\nThe benchmark step failed before producing results. Check the workflow logs (common cause: missing `GEMINI_API_KEY` secret on a fork PR).';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
