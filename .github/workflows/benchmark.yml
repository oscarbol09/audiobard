# Attribution benchmark CI workflow.
# Runs weekly and on-demand to track regression in dialog attribution accuracy.

name: Benchmark

on:
  schedule:
    # Every Monday at 4:00 AM UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      llm:
        description: "LLM provider to benchmark"
        required: true
        default: "ollama"
        type: choice
        options:
          - ollama
          - gemini
          - openrouter
      model:
        description: "Model to benchmark"
        required: true
        default: "qwen2.5:7b"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    name: Dialog Attribution Accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev,llm-ollama]"

      - name: Install and start Ollama
        # Run only if benchmarking Ollama (or if it's the weekly cron run)
        if: ${{ github.event.inputs.llm == 'ollama' || github.event_name == 'schedule' || github.event.inputs.llm == '' }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for Ollama to startup
          for i in {1..30}; do
            curl -s http://localhost:11434 && break
            sleep 1
          done
          ollama pull "${{ github.event.inputs.model || 'qwen2.5:7b' }}"

      - name: Run benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python eval/benchmark.py \
            --llm "${{ github.event.inputs.llm || 'ollama' }}" \
            --model "${{ github.event.inputs.model || 'qwen2.5:7b' }}"
