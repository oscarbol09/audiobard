[package]
name = "audiobard"
version = "0.1.0"
description = "AudioBard - AI-powered audiobook generator with multi-character voice synthesis"
authors = ["Oscar Bol"]
license = "MIT"
repository = "https://github.com/oscarbol09/audiobard"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "audiobard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
