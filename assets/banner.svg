<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="abBannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="abTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="abGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#abBannerBg)" stroke="#30363d" stroke-width="2" />

  <!-- Subtle Grid Lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.35">
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="440" y1="0" x2="440" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="760" y1="0" x2="760" y2="320" />
    <line x1="920" y1="0" x2="920" y2="320" />
    <line x1="1080" y1="0" x2="1080" y2="320" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Left Icon Card -->
  <g transform="translate(60, 45)">
    <rect width="230" height="230" rx="46" fill="#161b22" stroke="#30363d" stroke-width="2" filter="url(#abGlow)" />
    
    <!-- Open Book & Audio Waves Graphic -->
    <g transform="translate(45, 45)">
      <!-- Open Book Pages -->
      <path d="M10,80 C35,65 65,65 70,85 C75,65 105,65 130,80 L130,125 C105,110 75,110 70,130 C65,110 35,110 10,125 Z" fill="#21262d" stroke="#58a6ff" stroke-width="2.5" />
      <path d="M70,85 L70,130" stroke="#58a6ff" stroke-width="2.5" />
      
      <!-- Audio Wave Bars emerging from book -->
      <g stroke-linecap="round" stroke-width="4">
        <!-- Center high wave -->
        <line x1="70" y1="45" x2="70" y2="10" stroke="#a371f7" />
        <!-- Mid waves -->
        <line x1="55" y1="52" x2="55" y2="22" stroke="#38bdf8" />
        <line x1="85" y1="52" x2="85" y2="22" stroke="#38bdf8" />
        <!-- Low waves -->
        <line x1="40" y1="60" x2="40" y2="35" stroke="#34d399" />
        <line x1="100" y1="60" x2="100" y2="35" stroke="#34d399" />
        <!-- Outer waves -->
        <line x1="25" y1="68" x2="25" y2="48" stroke="#fbbf24" />
        <line x1="115" y1="68" x2="115" y2="48" stroke="#fbbf24" />
      </g>

      <!-- Sound Wave Arcs -->
      <path d="M10,25 C-5,45 -5,80 10,100" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" />
      <path d="M130,25 C145,45 145,80 130,100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" />
    </g>
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(330, 75)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="250" height="26" rx="13" fill="#8957e5" fill-opacity="0.15" stroke="#a371f7" stroke-width="1.2" />
      <circle cx="14" cy="13" r="5" fill="#38bdf8" />
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d2a8ff" letter-spacing="0.5">OPEN-SOURCE AUDIOBOOK ENGINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#abTextGrad)" letter-spacing="-1">
      AudioBard
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#8b949e">
      Multi-voice audiobook generator with <tspan fill="#ffffff" font-weight="600">distinct voices per character</tspan>.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 140)">
      <g transform="translate(0, 0)">
        <rect width="160" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#7ee787">Desktop App + CLI</text>
      </g>
      <g transform="translate(170, 0)">
        <rect width="175" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#79c0ff">Offline Mode (Ollama)</text>
      </g>
      <g transform="translate(355, 0)">
        <rect width="180" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#d2a8ff">Neural TTS (Piper/Edge)</text>
      </g>
      <g transform="translate(545, 0)">
        <rect width="155" height="30" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
        <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#ffa657">Cloud BYOK Support</text>
      </g>
    </g>
  </g>
</svg>
