<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#8957e5" />
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="pipeShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="10" y="10" width="900" height="360" rx="14" fill="url(#pipeBg)" stroke="#30363d" stroke-width="2" filter="url(#pipeShadow)" />

  <!-- Header -->
  <path d="M10,10 L910,10 Q910,10 910,48 L10,48 Z" fill="#161b22" />
  <line x1="10" y1="48" x2="910" y2="48" stroke="#30363d" stroke-width="1" />
  
  <circle cx="35" cy="29" r="5" fill="#ff5f56" />
  <circle cx="52" cy="29" r="5" fill="#ffbd2e" />
  <circle cx="69" cy="29" r="5" fill="#27c93f" />
  <text x="460" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="600">
    AudioBard Multi-Voice Pipeline Architecture
  </text>

  <!-- Step 1: Input -->
  <g transform="translate(35, 75)">
    <rect width="145" height="135" rx="10" fill="#21262d" stroke="#38bdf8" stroke-width="2" />
    <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Ingest</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">📖</text>
    <text x="72" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">EPUB / TXT</text>
    <text x="72" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Chapters &amp; Structure</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M185, 142 L205, 142" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
  <polygon points="212,142 202,137 202,147" fill="#58a6ff" />

  <!-- Step 2: Character Detection (LLM) -->
  <g transform="translate(215, 75)">
    <rect width="145" height="135" rx="10" fill="#21262d" stroke="#a371f7" stroke-width="2" />
    <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a371f7" text-anchor="middle">2. Character LLM</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">🎭</text>
    <text x="72" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">Ollama / Gemini</text>
    <text x="72" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Cast &amp; Tone Extraction</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="392,142 382,137 382,147" fill="#a371f7" />

  <!-- Step 3: Dialog Attribution -->
  <g transform="translate(395, 75)">
    <rect width="145" height="135" rx="10" fill="#21262d" stroke="#f59e0b" stroke-width="2" />
    <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">3. Attribution</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">💬</text>
    <text x="72" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">Who Says What?</text>
    <text x="72" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Emotion &amp; Context</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="572,142 562,137 562,147" fill="#f59e0b" />

  <!-- Step 4: Neural TTS -->
  <g transform="translate(575, 75)">
    <rect width="145" height="135" rx="10" fill="#21262d" stroke="#34d399" stroke-width="2" />
    <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">4. Neural Voice</text>
    <text x="72" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">🎙️</text>
    <text x="72" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">Piper / Edge TTS</text>
    <text x="72" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Distinct Voice per Cast</text>
  </g>

  <!-- Arrow 4 -->
  <polygon points="752,142 742,137 742,147" fill="#34d399" />

  <!-- Step 5: Output Audiobook -->
  <g transform="translate(755, 75)">
    <rect width="130" height="135" rx="10" fill="#21262d" stroke="#ec4899" stroke-width="2" />
    <text x="65" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ec4899" text-anchor="middle">5. Assembly</text>
    <text x="65" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle">🎧</text>
    <text x="65" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">MP3 / M4B</text>
    <text x="65" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Chapters &amp; ID3 Tags</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(35, 240)">
    <rect width="850" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    
    <g transform="translate(25, 25)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#58a6ff">📴 100% Offline Mode:</text>
      <text x="175" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c9d1d9">Ollama (qwen2.5 / llama3.3) + Piper TTS (fast, CPU-friendly neural voices). Zero data leaves your machine.</text>

      <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">🔑 Cloud BYOK Mode:</text>
      <text x="175" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c9d1d9">NVIDIA NIM, OpenRouter, Google Gemini + Edge TTS. Free tiers, no local GPU needed.</text>
    </g>
  </g>
</svg>
